<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RailBlock AI | Delhi–Ghaziabad</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            rail: { 500: '#0c8ce9', 600: '#006fc7', 700: '#0158a1', 800: '#064b85', 900: '#0b3f6e', 950: '#072849' }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: Inter, system-ui, sans-serif; }
    .sidebar-link.active { background: linear-gradient(90deg, #0158a1, #0c8ce9); color: #fff; }
    .fade-in { animation: fadeIn .35s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <!-- Login -->
  <div id="login-screen" class="fixed inset-0 z-50 bg-gradient-to-br from-rail-950 via-rail-900 to-rail-800 flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <div class="inline-flex w-16 h-16 rounded-2xl bg-gradient-to-br from-sky-400 to-rail-600 text-white text-3xl font-bold items-center justify-center mb-4">R</div>
        <h1 class="text-3xl font-bold text-white">RailBlock AI</h1>
        <p class="text-sky-200 text-sm mt-1">AI Block Planning · Delhi–Ghaziabad</p>
        <p class="text-rail-300 text-xs mt-1">Ministry of Railways</p>
      </div>
      <div class="bg-white rounded-2xl shadow-2xl p-6">
        <h2 class="text-xl font-bold mb-1">Select Your Role</h2>
        <p class="text-sm text-slate-500 mb-5">Choose role to continue</p>
        <div id="role-list" class="space-y-3"></div>
      </div>
    </div>
  </div>

  <div id="app" class="hidden flex h-screen">
    <aside class="w-64 bg-rail-900 text-white flex flex-col shrink-0">
      <div class="p-5 border-b border-rail-800">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-sky-500 flex items-center justify-center font-bold">R</div>
          <div>
            <div class="font-bold">RailBlock AI</div>
            <div class="text-xs text-rail-300">Delhi–Ghaziabad</div>
          </div>
        </div>
      </div>
      <nav class="flex-1 p-3 space-y-1 text-sm">
        <button class="sidebar-link active w-full flex gap-3 px-3 py-2.5 rounded-lg" data-view="dashboard"><i class="fas fa-chart-pie w-5"></i> Dashboard</button>
        <button class="sidebar-link w-full flex gap-3 px-3 py-2.5 rounded-lg" data-view="tasks"><i class="fas fa-list-check w-5"></i> Task Priority</button>
        <button class="sidebar-link w-full flex gap-3 px-3 py-2.5 rounded-lg" data-view="schedule"><i class="fas fa-train w-5"></i> Train Schedule</button>
        <button class="sidebar-link w-full flex gap-3 px-3 py-2.5 rounded-lg" data-view="optimizer"><i class="fas fa-brain w-5"></i> AI Optimizer</button>
        <button class="sidebar-link w-full flex gap-3 px-3 py-2.5 rounded-lg" data-view="approval"><i class="fas fa-user-check w-5"></i> Officer Approval</button>
        <button class="sidebar-link w-full flex gap-3 px-3 py-2.5 rounded-lg" data-view="resources"><i class="fas fa-users-cog w-5"></i> Resources</button>
        <button class="sidebar-link w-full flex gap-3 px-3 py-2.5 rounded-lg" data-view="whatif"><i class="fas fa-flask w-5"></i> What-If</button>
      </nav>
      <div class="p-4 border-t border-rail-800 text-sm">
        <div class="flex items-center gap-3 mb-2">
          <div id="u-av" class="w-9 h-9 rounded-full bg-rail-600 flex items-center justify-center font-semibold">?</div>
          <div>
            <div id="u-name" class="font-medium">User</div>
            <div id="u-role" class="text-xs text-rail-400">Role</div>
          </div>
        </div>
        <button onclick="logout()" class="w-full text-xs text-rail-300 hover:text-white py-2 rounded-lg hover:bg-rail-800"><i class="fas fa-sign-out-alt"></i> Switch User</button>
      </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
      <header class="bg-white border-b px-6 py-3 flex justify-between items-center">
        <div>
          <h2 id="page-title" class="text-xl font-bold">Dashboard</h2>
          <p class="text-sm text-slate-500">Section: Delhi–Ghaziabad · Live DB</p>
        </div>
        <button onclick="runOptimize()" class="bg-rail-600 hover:bg-rail-700 text-white px-4 py-2 rounded-lg text-sm font-semibold">
          <i class="fas fa-magic"></i> Run AI Optimizer
        </button>
      </header>
      <div class="flex-1 overflow-y-auto p-6">
        <div id="view-dashboard" class="fade-in space-y-4"></div>
        <div id="view-tasks" class="hidden fade-in"></div>
        <div id="view-schedule" class="hidden fade-in"></div>
        <div id="view-optimizer" class="hidden fade-in"></div>
        <div id="view-approval" class="hidden fade-in"></div>
        <div id="view-resources" class="hidden fade-in"></div>
        <div id="view-whatif" class="hidden fade-in"></div>
      </div>
    </main>
  </div>

  <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white px-5 py-3 rounded-lg shadow-xl text-sm hidden z-50"></div>
  <script src="/static/js/app.js"></script>
</body>
</html>
